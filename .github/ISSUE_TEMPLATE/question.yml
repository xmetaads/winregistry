name: Support question
description: Ask about using regx or deploying it safely.
title: "[Question] "
labels: ["question", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste `regx --version`, or say that you are building from source.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands, exit codes, and non-secret output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows edition/build, architecture, elevation state, and relevant policy controls.
    validations:
      required: true
