name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS here. The environment variable replaces
  # the `rustflags` in .cargo/config.toml wholesale rather than adding to it, so
  # `RUSTFLAGS: -D warnings` would silently drop `+crt-static` and produce a
  # build that needs the VC++ redistributable — the opposite of what this
  # product promises. Warnings are denied per-command instead, and the static
  # link is asserted below rather than assumed.

permissions:
  contents: read

jobs:
  test:
    name: Test (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No toolchain is named here on purpose: rustup reads rust-toolchain.toml,
      # which pins the exact version. Passing `stable` would override the pin and
      # let CI drift onto a compiler with a different lint set than developers run.
      - name: Show the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # A handful of assertions are about the environment rather than the code:
      # that an HKLM write is refused, that System32 is not writable. They are
      # the product's central premise, but `windows-latest` runs as an
      # administrator, so they are inverted here and the tests say so and skip
      # rather than failing on a property of the runner. Run the suite locally
      # as a standard user to exercise them for real.
      # Failures are re-emitted as annotations. A raw log needs a token to read,
      # so a bare "exit code 1" tells anyone outside the repo nothing about
      # which assertion broke — including on a fork or a public bug report.
      - name: Test
        shell: pwsh
        run: |
          $out = cargo test --all-targets --no-fail-fast -- --nocapture 2>&1 | Tee-Object -Variable lines
          $out | Out-String | Write-Host

          $failed = $lines | Select-String -Pattern '^test (.+) \.\.\. FAILED$' |
                    ForEach-Object { $_.Matches[0].Groups[1].Value }
          foreach ($t in $failed) { Write-Host "::error title=Test failed::$t" }

          $panics = $lines | Select-String -Pattern "panicked at (.+)$" |
                    ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 10
          foreach ($p in $panics) { Write-Host "::error title=Panic::$p" }

          if ($failed.Count -gt 0) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Note which assertions the runner could not exercise
        if: always()
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($admin) {
            "::warning::The runner is elevated, so the standard-user assertions " +
            "(HKLM denied, System32 not writable) were skipped. They are exercised " +
            "when the suite runs as a normal user."
          } else {
            "runner is unelevated: the standard-user assertions were exercised"
          }

      - name: Build release
        run: cargo build --release

      - name: Verify the shipped binary keeps its promises
        shell: pwsh
        run: |
          $exe = "target/release/regx.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))

          if ($text -notmatch 'requestedExecutionLevel\s+level="asInvoker"') {
            throw "the asInvoker manifest is not embedded"
          }
          if ($text -match 'level="requireAdministrator"' -or $text -match 'level="highestAvailable"') {
            throw "the binary requests elevation"
          }
          "manifest: asInvoker, no elevation requested"

          # A dynamically linked CRT would import from vcruntime/msvcp. Their
          # absence is what makes the binary runnable without a redistributable,
          # and it is easy to lose to a stray RUSTFLAGS.
          $dynamic = @("VCRUNTIME140", "MSVCP140", "api-ms-win-crt")
          foreach ($dll in $dynamic) {
            if ($text -match [regex]::Escape($dll)) {
              throw "$dll is imported: the CRT is not statically linked"
            }
          }
          "CRT: statically linked"

          $bytes = (Get-Item $exe).Length
          $limit = 2 * 1MB
          if ($bytes -ge $limit) {
            throw "release binary is $bytes bytes; website contract requires less than 2 MiB ($limit bytes)"
          }
          $mb = [math]::Round($bytes / 1MB, 2)
          "size: $mb MB"

      - name: Verify a fresh relink is reproducible
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $first = Join-Path $env:RUNNER_TEMP "regx-first.exe"
          Copy-Item target/release/regx.exe $first
          cargo clean --release -p regx
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "fresh release relink failed" }

          $firstHash = (Get-FileHash $first -Algorithm SHA256).Hash.ToLower()
          $secondHash = (Get-FileHash target/release/regx.exe -Algorithm SHA256).Hash.ToLower()
          if ($firstHash -ne $secondHash) {
            throw "release build is not reproducible: $firstHash != $secondHash"
          }
          "reproducible SHA-256: $secondHash"

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/regx.exe -Algorithm SHA256).Hash.ToLower()
          "$h  regx.exe" | Tee-Object -FilePath target/release/regx.exe.sha256

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regx-x86_64
          path: |
            target/release/regx.exe
            target/release/regx.exe.sha256

  test-standard-user:
    name: Test (standard user)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      # windows-latest runs elevated, so the assertions that define this product
      # — an HKLM write is refused, System32 is not writable, the process never
      # elevates — are inverted there and skip themselves. That left the central
      # premise unverified on every CI run, which is the wrong thing to be
      # taking on trust.
      #
      # The compiled test binaries are therefore run again as an unprivileged
      # local account created here, on a runner that is destroyed afterwards.
      # Ask cargo which binaries it produced rather than matching names. A
      # pattern would silently miss a test file added later, and this job
      # passing while covering nothing is the failure worth designing out.
      - name: Compile the tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = cargo test --all-targets --no-run --message-format=json
          $exes = $lines |
            Where-Object { $_ -match '^\{' } |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.executable -and $_.profile.test } |
            ForEach-Object { $_.executable }

          if (-not $exes) { throw "cargo reported no test executables" }
          $exes | ForEach-Object { "  $_" }
          $exes -join "`n" | Out-File -FilePath "$env:RUNNER_TEMP\test-binaries.txt" -Encoding utf8

      - name: Run them as an unprivileged account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Generated in memory and never written anywhere. The account exists
          # for the length of this job on a machine that is discarded after it.
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA1!"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          $user = "regxtest"
          New-LocalUser -Name $user -Password $secure -AccountNeverExpires `
              -UserMayNotChangePassword -Description "regx CI standard-user run" | Out-Null
          # Deliberately NOT added to Administrators. That is the whole point.
          Add-LocalGroupMember -Group "Users" -Member $user
          "created $user, member of: $((Get-LocalUser $user | Get-LocalGroupMember -ErrorAction SilentlyContinue).Name -join ', ')"

          # The account needs to read the workspace and write its own temp.
          & icacls "${env:GITHUB_WORKSPACE}" /grant "${user}:(OI)(CI)RX" /T /Q | Out-Null
          $scratch = Join-Path $env:RUNNER_TEMP "regxtest"
          New-Item -ItemType Directory -Force $scratch | Out-Null
          & icacls $scratch /grant "${user}:(OI)(CI)F" /T /Q | Out-Null

          $cred = New-Object System.Management.Automation.PSCredential($user, $secure)

          # Start-Process does not load the target account's profile, so the
          # child inherits this process's TEMP — which belongs to the runner's
          # administrator and is not writable by an unprivileged account. The
          # suites create scratch directories under TEMP, so point it at the
          # one that was just granted to the account.
          $env:TEMP = $scratch
          $env:TMP = $scratch

          $tests = Get-Content "$env:RUNNER_TEMP\test-binaries.txt" |
            Where-Object { $_ -and (Test-Path $_) } |
            ForEach-Object { Get-Item $_ }
          if (-not $tests) { throw "no test binaries were recorded by the compile step" }
          "running $($tests.Count) test binary/binaries as $user"

          $failed = @()
          foreach ($t in $tests) {
            "--- $($t.Name) ---"
            $out = Join-Path $scratch "$($t.BaseName).out"
            $err = Join-Path $scratch "$($t.BaseName).err"

            $p = Start-Process -FilePath $t.FullName `
                -ArgumentList "--nocapture" `
                -Credential $cred `
                -WorkingDirectory $scratch `
                -RedirectStandardOutput $out `
                -RedirectStandardError $err `
                -PassThru -Wait -NoNewWindow
            $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) +
                    (Get-Content $err -Raw -ErrorAction SilentlyContinue)
            $text | Write-Host

            if ($p.ExitCode -ne 0) {
              $failed += $t.Name
              foreach ($line in ($text -split "`n" | Select-String "FAILED|panicked at")) {
                Write-Host "::error title=Standard-user test::$($t.Name): $line"
              }
            }

            # The point of this job is that these assertions run rather than
            # skip. If they skipped here too, the account is not unprivileged
            # and the job is proving nothing.
            if ($text -match "SKIPPED: .*elevated") {
              Write-Host "::error title=Standard-user test::assertions still skipped - the account is elevated, so this job verified nothing"
              $failed += "$($t.Name) (skipped)"
            }
          }

          Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
          if ($failed.Count -gt 0) {
            throw "failed as a standard user: $($failed -join ', ')"
          }
          Write-Host "::notice title=Standard-user test::The premise assertions - HKLM denied, System32 not writable, never elevated - were exercised for real."

  signing-pipeline:
    name: Signing pipeline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Build
        run: cargo build --release

      # Signing is the last barrier to enterprise deployment and it needs a
      # certificate, which is a procurement decision. What must not also be
      # unknown is whether the pipeline around that certificate works. This
      # rehearses the whole thing with a throwaway key generated here, on an
      # ephemeral runner that is destroyed afterwards — so when a real
      # certificate arrives, swapping it in is the only remaining step.
      #
      # Nothing here touches a developer's machine or trust store.
      - name: Rehearse signing with a throwaway certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # signtool ships in the Windows SDK and is not on PATH by default.
          # Locating it explicitly, newest first, rather than assuming — the
          # first version of this step assumed and failed with a bare exit 1.
          $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
              -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Host "::error title=Signing pipeline::signtool.exe not found in the Windows SDK on this runner"
            exit 1
          }
          "signtool: $signtool"

          $exe = "target/release/regx.exe"
          $signed = "target/release/regx-signed.exe"
          Copy-Item $exe $signed

          $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=regx CI signing rehearsal, O=winregistry.org" `
              -KeyUsage DigitalSignature `
              -HashAlgorithm SHA256 `
              -CertStoreLocation Cert:\CurrentUser\My
          "certificate: $($cert.Subject) ($($cert.Thumbprint))"

          # /fd SHA256 because SHA-1 is rejected by current Windows.
          # No /tr: a public timestamp service will not countersign a
          # certificate it has never seen, and the release workflow passes /tr
          # with a real one. What this establishes is that the signing and
          # verification wiring is correct.
          $out = & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $signed 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Signing pipeline::signtool sign failed ($LASTEXITCODE): $($out -join ' ')"
            exit 1
          }
          "signtool: signed"

          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Verify the rehearsal, and that regx reports it honestly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signed = "target/release/regx-signed.exe"
          $unsigned = "target/release/regx.exe"

          $sig = Get-AuthenticodeSignature $signed
          if ($null -eq $sig.SignerCertificate) {
            Write-Host "::error title=Signing pipeline::no signature was attached to the binary"
            exit 1
          }
          "attached: $($sig.SignerCertificate.Subject)"

          # A self-signed certificate chains to a root the machine does not
          # trust, so Windows must say UnknownError / NotTrusted here. If it
          # said Valid, the trust decision would not mean anything.
          "chain status: $($sig.Status)"
          if ($sig.Status -eq "Valid") {
            throw "a self-signed certificate must not validate; trust is not being checked"
          }

          # And regx's own reporting has to agree with Windows. An unsigned
          # build says 'unsigned'; a signed-but-untrusted one says 'untrusted'.
          # Reporting a signed binary as unsigned, or the reverse, is the
          # failure that matters: an administrator would act on it.
          #
          # --self-check exits 5 when it finds anything to warn about, and an
          # unsigned binary is exactly that. So its exit code is expected here
          # and must not be mistaken for the step failing — which is what
          # happened the first time this ran, since PowerShell carries the last
          # native exit code out of the step.
          $before = (& $unsigned --self-check | Out-String)
          $beforeExit = $LASTEXITCODE
          $after = (& $signed --self-check | Out-String)
          $afterExit = $LASTEXITCODE

          $beforeLine = ($before -split "`n" | Select-String "signature") -join ""
          $afterLine  = ($after  -split "`n" | Select-String "signature") -join ""
          "unsigned build (exit $beforeExit) -> $beforeLine"
          "signed build   (exit $afterExit) -> $afterLine"

          $problems = @()
          if ($beforeLine -notmatch "unsigned") {
            $problems += "the unsigned build was not reported as unsigned"
          }
          if ($afterLine -notmatch "untrusted") {
            $problems += "the signed-but-untrusted build was not reported as untrusted"
          }
          if ($problems.Count -gt 0) {
            foreach ($p in $problems) {
              Write-Host "::error title=Signing pipeline::$p"
            }
            exit 1
          }
          "regx signature reporting agrees with Windows"

          Write-Host "::notice title=Signing pipeline::Rehearsed end to end with a throwaway certificate. Releases remain UNSIGNED until SIGNING_CERT_BASE64 and SIGNING_CERT_PASSWORD are configured - see docs/SIGNING.md."

          # Explicit, so a tolerated non-zero from --self-check above cannot
          # become the step's result.
          exit 0

  build-arm64:
    name: Build (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      # The runner does not ship the ARM64 MSVC linker, and without it the
      # target fails to link. Installing it is what makes an ARM64 claim in the
      # documentation verifiable rather than assumed — it was previously
      # advertised without ever having been built.
      - name: Install the ARM64 MSVC toolchain
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $path = & "$root\vswhere.exe" -latest -property installationPath
          & "$root\vs_installer.exe" modify --installPath $path --quiet --norestart --nocache `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "failed to install the ARM64 toolchain (exit $LASTEXITCODE)"
          }

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: SHA-256
        shell: pwsh
        run: |
          $exe = "target/aarch64-pc-windows-msvc/release/regx.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  regx.exe" | Tee-Object -FilePath "$exe.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regx-aarch64
          path: |
            target/aarch64-pc-windows-msvc/release/regx.exe
            target/aarch64-pc-windows-msvc/release/regx.exe.sha256

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Two questions procurement always asks: is anything known-vulnerable,
      # and is every licence acceptable to redistribute?
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Links, anchors, contrast and CSP-safe markup
        run: |
          python3 scripts/check_site.py --self-test
          python3 scripts/check_site.py

      - name: vercel.json stays consistent with the pages
        run: python3 scripts/check_vercel.py

      - name: Deployed-site verifier reports transport failures cleanly
        run: python3 scripts/check_deployed_site.py --self-test

      - name: Workflow actions stay immutable
        run: python3 scripts/check_workflows.py

      - name: Release asset validator accepts good and rejects bad fixtures
        run: python3 scripts/check_release_assets.py --self-test

      - name: Release identity validator accepts good and rejects bad fixtures
        run: python3 scripts/check_release_identity.py --self-test
