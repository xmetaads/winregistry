name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS here. The environment variable replaces
  # the `rustflags` in .cargo/config.toml wholesale rather than adding to it, so
  # `RUSTFLAGS: -D warnings` would silently drop `+crt-static` and produce a
  # build that needs the VC++ redistributable — the opposite of what this
  # product promises. Warnings are denied per-command instead, and the static
  # link is asserted below rather than assumed.

jobs:
  test:
    name: Test (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No toolchain is named here on purpose: rustup reads rust-toolchain.toml,
      # which pins the exact version. Passing `stable` would override the pin and
      # let CI drift onto a compiler with a different lint set than developers run.
      - name: Show the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # A handful of assertions are about the environment rather than the code:
      # that an HKLM write is refused, that System32 is not writable. They are
      # the product's central premise, but `windows-latest` runs as an
      # administrator, so they are inverted here and the tests say so and skip
      # rather than failing on a property of the runner. Run the suite locally
      # as a standard user to exercise them for real.
      - name: Test
        run: cargo test --all-targets -- --nocapture

      - name: Note which assertions the runner could not exercise
        if: always()
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($admin) {
            "::warning::The runner is elevated, so the standard-user assertions " +
            "(HKLM denied, System32 not writable) were skipped. They are exercised " +
            "when the suite runs as a normal user."
          } else {
            "runner is unelevated: the standard-user assertions were exercised"
          }

      - name: Build release
        run: cargo build --release

      - name: Verify the shipped binary keeps its promises
        shell: pwsh
        run: |
          $exe = "target/release/regx.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))

          if ($text -notmatch 'requestedExecutionLevel\s+level="asInvoker"') {
            throw "the asInvoker manifest is not embedded"
          }
          if ($text -match 'level="requireAdministrator"' -or $text -match 'level="highestAvailable"') {
            throw "the binary requests elevation"
          }
          "manifest: asInvoker, no elevation requested"

          # A dynamically linked CRT would import from vcruntime/msvcp. Their
          # absence is what makes the binary runnable without a redistributable,
          # and it is easy to lose to a stray RUSTFLAGS.
          $dynamic = @("VCRUNTIME140", "MSVCP140", "api-ms-win-crt")
          foreach ($dll in $dynamic) {
            if ($text -match [regex]::Escape($dll)) {
              throw "$dll is imported: the CRT is not statically linked"
            }
          }
          "CRT: statically linked"

          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          "size: $mb MB"

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/regx.exe -Algorithm SHA256).Hash.ToLower()
          "$h  regx.exe" | Tee-Object -FilePath target/release/regx.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: regx-x86_64
          path: |
            target/release/regx.exe
            target/release/regx.exe.sha256

  build-arm64:
    name: Build (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The runner does not ship the ARM64 MSVC linker, and without it the
      # target fails to link. Installing it is what makes an ARM64 claim in the
      # documentation verifiable rather than assumed — it was previously
      # advertised without ever having been built.
      - name: Install the ARM64 MSVC toolchain
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $path = & "$root\vswhere.exe" -latest -property installationPath
          & "$root\vs_installer.exe" modify --installPath $path --quiet --norestart --nocache `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "failed to install the ARM64 toolchain (exit $LASTEXITCODE)"
          }

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: SHA-256
        shell: pwsh
        run: |
          $exe = "target/aarch64-pc-windows-msvc/release/regx.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  regx.exe" | Tee-Object -FilePath "$exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: regx-aarch64
          path: |
            target/aarch64-pc-windows-msvc/release/regx.exe
            target/aarch64-pc-windows-msvc/release/regx.exe.sha256

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Two questions procurement always asks: is anything known-vulnerable,
      # and is every licence acceptable to redistribute?
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Links, anchors, contrast and CSP-safe markup
        run: python3 scripts/check_site.py

      - name: vercel.json stays consistent with the pages
        run: python3 scripts/check_vercel.py
